name: revenue_conversion
version: "1.0"
profile: revenue_conversion
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

# Tag every BigQuery job with its dbt node and run, so analysis/measure_cost.py
# can report the bytes each model scanned.
query-comment:
  comment: '{{ {"app": "dbt", "invocation_id": invocation_id, "node_id": (node.unique_id if node else "internal")} | tojson }}'

vars:
  start_date: "2020-11-01"   # first day of the source data
  end_date: "2021-01-31"     # last day of the source data
  lookback_days: 3           # incremental runs reprocess this many recent days
  # Backfill a chosen range by passing both, e.g.
  # dbt run -s stg_events --vars '{backfill_start: "2020-12-01", backfill_end: "2020-12-31"}'
  backfill_start: null
  backfill_end: null

models:
  revenue_conversion:
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
